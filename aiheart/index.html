<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Heart: Clinical Scan</title>
    <style>
        /* --- TREVOGA STYLE (DARK MEDICAL) --- */
        :root {
            --primary-red: #eb2f06; /* Более агрессивный красный */
            --dark-bg: #000000;
            --card-bg: #1e1e1e;
            --text-main: #f1f2f6;
            --text-muted: #a4b0be;
            --border: #2f3542;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }

        .quiz-container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* HEADER: Progress & Section Info */
        .header-bar {
            padding: 15px 20px 10px;
            background: rgba(30, 30, 30, 0.95);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #333;
        }

        .progress-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }

        .section-badge {
            background: #2f3542;
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
        }

        .progress-track {
            height: 4px;
            background: #2f3542;
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary-red);
            width: 0%;
            transition: width 0.3s ease;
            box-shadow: 0 0 8px rgba(235, 47, 6, 0.6);
        }

        /* VISUAL ZONE */
        .visual-block {
            height: 180px;
            background: #000;
            position: relative;
            overflow: hidden;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .visual-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.6;
            transition: opacity 0.4s;
        }

        /* Анимация "Сканирования" */
        .scan-line {
            position: absolute;
            top: 0;
            width: 100%;
            height: 3px;
            background: var(--primary-red);
            box-shadow: 0 0 15px var(--primary-red);
            animation: scanMove 2.5s infinite linear;
            opacity: 0.7;
        }
        @keyframes scanMove { 0% {top: 0;} 100% {top: 100%;} }

        /* CONTENT BODY */
        .content-body {
            padding: 24px 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        h2 {
            font-size: 20px;
            font-weight: 700;
            margin: 0 0 10px 0;
            line-height: 1.35;
        }

        p.description {
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.5;
            margin: 0 0 25px 0;
        }

        /* Option Buttons */
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-option {
            background: #252527;
            border: 1px solid var(--border);
            color: #fff;
            padding: 16px;
            border-radius: 12px;
            text-align: left;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s;
        }

        .btn-option:active {
            transform: scale(0.98);
            background: #333;
        }

        .btn-option.selected {
            border-color: var(--primary-red);
            background: rgba(235, 47, 6, 0.1);
            color: var(--primary-red);
            font-weight: 600;
        }

        /* Primary Action Button (Next/Start) */
        .btn-action {
            width: 100%;
            background: var(--primary-red);
            color: #fff;
            border: none;
            padding: 18px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            margin-top: auto; /* Прижимает кнопку к низу, если контента мало */
            box-shadow: 0 5px 20px rgba(235, 47, 6, 0.3);
        }

        /* WARNING SCREEN STYLE */
        .warning-mode .visual-block {
            border-bottom: 3px solid var(--primary-red);
        }
        .warning-mode h2 { color: var(--primary-red); }

        /* ANALYSIS LOADER */
        .analysis-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            padding: 40px 0;
        }
        .heart-beat {
            font-size: 60px;
            margin-bottom: 20px;
            animation: heartBeat 1.2s infinite;
        }
        @keyframes heartBeat {
            0% { transform: scale(1); }
            15% { transform: scale(1.3); }
            30% { transform: scale(1); }
            45% { transform: scale(1.15); }
            60% { transform: scale(1); }
        }
        .log-text {
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: var(--primary-red);
            margin-top: 10px;
        }

    </style>
</head>

    function render() {
        if (currentStep >= steps.length) {
            startAnalysis();
            return;

        const step = steps[currentStep];

        // 1. Update Visuals
        const percent = Math.round((currentStep / steps.length) * 100);
        progressBar.style.width = percent + "%";
        progressPerc.innerText = percent + "%";
        if (step.section) sectionBadge.innerText = step.section;

        mainImg.style.opacity = 0.3;
        setTimeout(() => {
            mainImg.src = step.img;
            mainImg.style.opacity = 0.6;
        }, 200);

        // 2. Check Warning Mode
        if (step.type === 'warning') {
            app.classList.add('warning-mode');
        } else {
            app.classList.remove('warning-mode');
        }

        // 3. Render Content
        let html = '';

        if (step.type === 'intro' || step.type === 'warning') {
            html = `
                <div style="text-align:center; display:flex; flex-direction:column; justify-content:center; flex-grow:1;">

                </div>
                <button class="btn-action" onclick="next()">${step.btn}</button>
            `;
        } else {
            html = `
                <div>
                    <h2>${step.title}</h2>
                    <p class="description">${step.desc}</p>
                    <div class="options-grid">
                        ${step.opts.map(opt => `
                            <button class="btn-option" onclick="select(this)">

                                <span style="opacity:0.5">›</span>
                            </button>

                </div>
            `;
        }

        content.innerHTML = html;
        window.scrollTo(0,0);

        document.querySelectorAll('.btn-option').forEach(b => b.classList.remove('selected'));
        el.classList.add('selected');
        setTimeout(next, 200); // Быстрый переход
    }

    window.next = function() {
        currentStep++;
        render();
    }

            "Формирование персонального отчета..."
        ];

        let i = 0;
        function showLog() {
            if (i >= logs.length) {
                showFinal();

                    <h2 style="font-size:18px;">Анализ данных...</h2>
                    <div class="log-text">${logs[i]}</div>
                    <div style="margin-top:20px; width:200px; height:4px; background:#333; border-radius:2px;">
                        <div style="height:100%; background:#eb2f06; width:${(i+1)/logs.length*100}%; transition:width 0.5s;"></div>
                    </div>
                </div>
            `;
            i++;
            setTimeout(showLog, 1500); // 1.5 сек на шаг
        }
        showLog();
    }

    function showFinal() {
        content.innerHTML = `
            <div style="text-align:center; padding-top:20px;">
                <div style="font-size:60px; margin-bottom:10px;">⚠️</div>

                <p class="description" style="color:#fff;">
                    Обнаружено <span style="color:var(--primary-red); font-weight:bold;">5 критических факторов</span>, требующих немедленного внимания. 
                </p>

                <div style="background:#252527; border-radius:12px; padding:20px; text-align:left; margin-bottom:25px; font-size:14px; border-left: 4px solid var(--primary-red);">
                    <div style="margin-bottom:10px; font-weight:bold; color:#fff;">ВАШ РЕЗУЛЬТАТ СОДЕРЖИТ:</div>
                    <div style="margin-bottom:5px;">✅ Карта рисков инфаркта</div>
                    <div style="margin-bottom:5px;">✅ Прогноз здоровья на 3 года</div>
                    <div style="margin-bottom:5px;">✅ План снижения давления и стресса</div>
                    <div>✅ Рекомендации по анализам</div>
                </div>

                <p style="font-size:12px; color:#666; margin-bottom:20px;">
                    Вы потратили 5 минут на этот тест. Потратьте еще 2 минуты, чтобы изучить отчет, который может спасти вам жизнь.
                </p>

                <button class="btn-action" onclick="finish()">ПОЛУЧИТЬ ПЛАН SPASENIE</button>

        `;
    }

    window.finish = function() {
        // РЕДИРЕКТ НА ОФФЕР
        alert("Здесь должен быть редирект на платёжную страницу");
    }

    init();
</script>
